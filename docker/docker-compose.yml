version: '3.8'

services:
    db:
        image: mysql:5.7
        container_name: db_magasin
        restart: always
        environment:
          MYSQL_DATABASE: db_magasin_electronique
          MYSQL_ROOT_PASSWORD: 
        ports:
          - "3306:3306"
        volumes:
          - db_data:/var/lib/mysql
          - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    
    app:
        image: php:7.4-apache
        container_name: php_magasin
        restart: always
        ports:
          - "80:80"
        volumes:
          - ./www:/var/www/html
        depends_on:
          - db
        build:
          context: .
          dockerfile: Dockerfile

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: pma_magasin
        restart: always
        ports:
          - "8080:80" 
        environment:
          - PMA_HOST=db 
          - PMA_ARBITRARY=1
        depends_on:
          - db
          
volumes:
  db_data: